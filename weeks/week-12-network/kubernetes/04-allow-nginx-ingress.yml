apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-partner-and-office-ingress-to-nginx
  namespace: green-dev-prod
spec:
  podSelector:
    matchLabels:
      app: nginx
      environment: prod
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.0.10.0/24
        - ipBlock:
            cidr: 10.0.20.0/24
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
