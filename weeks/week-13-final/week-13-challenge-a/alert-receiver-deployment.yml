apiVersion: v1
kind: ConfigMap
metadata:
  name: alert-receiver-app
  namespace: monitoring
data:
  app.py: |
    import json
    from http.server import BaseHTTPRequestHandler, HTTPServer


    class Handler(BaseHTTPRequestHandler):
        def do_POST(self):
            content_length = int(self.headers.get("Content-Length", "0"))
            payload = self.rfile.read(content_length).decode("utf-8")
            try:
                parsed = json.loads(payload)
                alerts = parsed.get("alerts", [])
                statuses = ", ".join(
                    f"{alert.get('labels', {}).get('alertname', 'unknown')}={alert.get('status', 'unknown')}"
                    for alert in alerts
                ) or "no-alerts"
                print(f"[alert-receiver] {self.path} {statuses}", flush=True)
                print(json.dumps(parsed, indent=2), flush=True)
            except json.JSONDecodeError:
                print(f"[alert-receiver] invalid-json {payload}", flush=True)

            self.send_response(200)
            self.end_headers()
            self.wfile.write(b"ok")

        def do_GET(self):
            if self.path == "/health":
                self.send_response(200)
                self.end_headers()
                self.wfile.write(b"ok")
                return
            self.send_response(404)
            self.end_headers()

        def log_message(self, format, *args):
            return


    HTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-receiver
  namespace: monitoring
  labels:
    app: alert-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alert-receiver
  template:
    metadata:
      labels:
        app: alert-receiver
    spec:
      containers:
      - name: alert-receiver
        image: python:3.11-alpine
        command:
          - python
          - /opt/receiver/app.py
        ports:
        - containerPort: 8080
          name: web
          protocol: TCP
        volumeMounts:
        - name: receiver-app
          mountPath: /opt/receiver/app.py
          subPath: app.py
        resources:
          requests:
            cpu: 25m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 64Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 2
          periodSeconds: 5
      volumes:
      - name: receiver-app
        configMap:
          name: alert-receiver-app
